[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modsmith"
version = "0.1.0"
description = "Install, check, update and port Minecraft mods to any Minecraft version"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
modsmith = "modsmith.cli:main"

[project.gui-scripts]
modsmith-gui = "modsmith.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
